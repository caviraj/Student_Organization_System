target-version = "py311"
line-length = 120

# Autogenerated by Alembic's script template, which emits `from typing import Sequence, Union`
# and `Union[str, None]` regardless of target version. The DDL in these files is hand-written;
# the scaffolding around it is not, so linting it only produces churn that the next
# `alembic revision --autogenerate` undoes.
exclude = ["alembic/versions"]

[lint]
ignore = [
    # FastAPI's dependency idiom is a call in a default argument.
    "B008",
    # Membership dates are local civil dates ("valid until 15 Oct"), not instants.
    "DTZ011",
]
